sentence=Driver for the Panchip XN297L 2.4GHz transceiver, with an RF24-compatible API and the undocumented RSSI.
paragraph=Auto-ack, dynamic and ACK payloads, multi-pipe, and RSSI readout. Handles the register-level differences that break nRF24L01 drivers on this chip: EN_PM, the RF_SETUP power table, two-step reset and the 1 Mbps SPI limit during init. Tested on ESP32 and ESP32-C3; builds for AVR, RP2040 and STM32.
