; STM32F030K6T6 + MPU6881 + XN297L  ->  ESP32-C3 with a 0.42" OLED
;
; Two boards, one project. The shared pieces are the XN297L library in the root
; of this repository, linked in place below, and include/link_packet.h (the wire
; format), so there is one definition of each and no chance of the two ends
; drifting apart.
;
;   pio run -e tx_stm32 -t upload      ST-Link, the sensor board
;   pio run -e rx_c3    -t upload      USB, the display board
;   pio run                            builds tx_stm32 (the default env)
;
; Sensor board wiring
;   MPU6881: SDA = PB6, SCL = PB7   (software I2C - matches this wiring as-is)
;   XN297L : SCK = PA5, MISO = PA6, MOSI = PA7, CE = PA4, CSN = PB0
;   Serial : USART1, TX = PA2, RX = PA3 -> USB-TTL adapter
;   Debug  : ST-Link on SWDIO = PA13, SWCLK = PA14, NRST, 3V3, GND
;
; Display board wiring
;   XN297L : SCK = 4, MISO = 3, MOSI = 10, CSN = 7, CE = 1
;   OLED   : on-board, SDA = 5, SCL = 6; BOOT button (GPIO9) turns the page
;
; Both radios want 10uF + 100nF right at the module pads. At +11 dBm the
; XN297L pulls about 66 mA in bursts and a thin 3V3 rail will brown out.

[platformio]
default_envs = tx_stm32

[env]
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../..

; ---------------------------------------------------------------------------
; Sender: STM32F030K6T6, reads the MPU6881 and transmits
; ---------------------------------------------------------------------------
[env:tx_stm32]
; Pinned. The STM32duino 3.0 core that ststm32 20.0.0 brings builds this sender
; about 5.8 KB larger, and on a 32 KB part that no longer fits -- CI caught it
; overflowing by 3.8 KB. 19.4.0 is what it was measured and run on.
platform = ststm32@19.4.0
board = genericSTM32F030K6

upload_protocol = stlink
debug_tool = stlink
; Set this to the COM port of the USB-TTL adapter, e.g. COM5
; monitor_port = COM5

build_src_filter = -<*> +<main_tx_stm32.cpp>
build_flags =
    -D SERIAL_UART_INSTANCE=1
    -D PIN_SERIAL_TX=PA2
    -D PIN_SERIAL_RX=PA3
; The radio register dump costs about 1.2 KB of flash and is the fastest way
; to tell "no SPI at all" from "wrong register". Uncomment to get it back if
; this env ever runs out of room.
;   -D XN297L_NO_DETAILS

; ---------------------------------------------------------------------------
; Receiver: ESP32-C3 with the on-board 72x40 OLED
; Native USB, so the CDC flags are needed for Serial to appear.
; ---------------------------------------------------------------------------
[env:rx_c3]
platform = espressif32
board = esp32-c3-devkitm-1

build_src_filter = -<*> +<main_rx_c3.cpp>
build_flags =
    -Wall
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env.lib_deps}
    olikraus/U8g2@^2.35.30
monitor_filters = esp32_exception_decoder, time
; upload_port  = COM6
; monitor_port = COM6
