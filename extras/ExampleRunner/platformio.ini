; Build and upload any sketch from examples/ with PlatformIO, against the
; library in this repository.
;
; PlatformIO has no notion of "run this .ino from somewhere else", but it does
; let the source directory be overridden per run. In PowerShell, from this folder:
;
;   $env:PLATFORMIO_SRC_DIR = "$PWD\..\..\examples\GettingStarted"
;   pio run -e esp32dev -t upload --upload-port COM3
;   pio device monitor -b 115200 -p COM3
;
; In bash:
;
;   PLATFORMIO_SRC_DIR=$PWD/../../examples/GettingStarted pio run -e esp32dev -t upload
;
; Each example's pin block already matches these boards' default SPI pins.
; The STM32F030K6 board definition is borrowed from the IMU link project rather
; than copied.

[platformio]
boards_dir = ../STM32F030_IMU_Link/boards

[env]
framework     = arduino
monitor_speed = 115200
lib_deps      = symlink://../..

[env:esp32dev]
platform = espressif32
board    = esp32dev

[env:esp32c3]
platform    = espressif32
board       = esp32-c3-devkitm-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:uno]
platform = atmelavr
board    = uno

; STM32F030K6T6: 32 KB of flash, and every example fits (17.7-25.1 KB). Serial is
; USART1 on PA2 (TX) / PA3 (RX); flash it over ST-Link. Pinned to the last
; STM32duino 2.x platform, which those sizes were measured on: the 3.0 core in
; 20.0.0 adds ~5.8 KB.
[env:f030k6]
platform        = ststm32@19.7.1
board           = genericSTM32F030K6
upload_protocol = stlink
build_flags     = -D SERIAL_UART_INSTANCE=1 -D PIN_SERIAL_TX=PA2 -D PIN_SERIAL_RX=PA3
