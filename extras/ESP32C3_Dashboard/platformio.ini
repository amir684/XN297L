; XN297L library -- ESP32 / ESP32-C3 dashboard, built against the library in
; the repository root
;
; Build & upload:
;   pio run -e tx -t upload --upload-port COM3
;   pio run -e rx -t upload --upload-port COM4
; or use the PlatformIO sidebar: Project Tasks -> tx / rx -> Upload & Monitor
;
; The sidebar also carries the two boards of the STM32F030 IMU link --
; imu_tx_stm32 and imu_rx_c3 -- at the bottom of this file.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Custom board definition for the IMU link's STM32F030K6T6.
boards_dir = ../STM32F030_IMU_Link/boards

[env]
platform      = espressif32
board         = upesy_wroom
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags   = -Wall
; src/ also holds the IMU link wrappers, so each env picks its one entry point.
build_src_filter = -<*> +<main.cpp>
; The library is the repository root. symlink:// builds it in place, so edits
; to src/XN297L.* show up here without reinstalling anything.
lib_deps      = symlink://../..

[env:tx]
build_flags = ${env.build_flags} -DROLE_TX
; upload_port  = COM3
; monitor_port = COM3

[env:rx]
build_flags = ${env.build_flags} -DROLE_RX
; upload_port  = COM4
; monitor_port = COM4

; Responder on an ESP32-C3 board with the built-in 0.42" 72x40 OLED
; (01Space ESP32-C3-0.42LCD and clones). Same responder firmware as [env:rx],
; plus a status screen. Native USB, so the CDC flags are needed for Serial.
[env:rx_c3]
board       = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DROLE_RX -DBOARD_C3 -DBOARD_C3_OLED
              -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps    = ${env.lib_deps}
              olikraus/U8g2@^2.35.30
; upload_port  = COM6
; monitor_port = COM6

; Initiator on an ESP32-C3 SuperMini. Same radio wiring as [env:rx_c3] -- the
; C3 pin map is shared, so one jumper harness fits both boards.
[env:tx_c3]
board       = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DROLE_TX -DBOARD_C3 -DBOARD_C3_SUPERMINI
              -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
; upload_port  = COM7
; monitor_port = COM7

; RSSI hunt: flash this instead of rx, leave the other board running tx.
; Sweeps single-bit flips of the undocumented registers 0x19 / 0x1B / 0x1E
; looking for one that makes register 0x09 report. See README.md.
[env:scan]
build_flags = ${env.build_flags} -DROLE_SCAN
; upload_port  = COM4
; monitor_port = COM4

; ---- STM32F030 IMU link --------------------------------------------------------
; The two boards of extras/STM32F030_IMU_Link, available from this sidebar too.
; PlatformIO has no per-env source directory, so src/imu_*.cpp each pull in the
; real file from that project -- the code lives there, once.

; Sender: STM32F030K6T6 + MPU6881, flashed over ST-Link, serial on a USB-TTL
; adapter at PA2/PA3. Pinned to the last STM32duino 2.x platform: the 3.0 core
; builds it 5.8 KB larger and it no longer fits the 32 KB part.
[env:imu_tx_stm32]
platform         = ststm32@19.7.1
board            = genericSTM32F030K6
upload_protocol  = stlink
debug_tool       = stlink
monitor_filters  = time
build_src_filter = -<*> +<imu_tx_stm32.cpp>
build_flags      = -I$PROJECT_DIR/../STM32F030_IMU_Link/include
                   -D SERIAL_UART_INSTANCE=1
                   -D PIN_SERIAL_TX=PA2
                   -D PIN_SERIAL_RX=PA3
lib_ldf_mode     = deep+
; monitor_port = COM5

; Receiver: ESP32-C3 with the 0.42" OLED, eight pages on the BOOT button.
[env:imu_rx_c3]
board            = esp32-c3-devkitm-1
build_src_filter = -<*> +<imu_rx_c3.cpp>
build_flags      = ${env.build_flags}
                   -I$PROJECT_DIR/../STM32F030_IMU_Link/include
                   -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps         = ${env.lib_deps}
                   olikraus/U8g2@^2.35.30
lib_ldf_mode     = deep+
; upload_port  = COM6
; monitor_port = COM6
